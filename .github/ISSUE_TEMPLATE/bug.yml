name: Bug
description: Something does not work as the docs say it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: For a security problem, do not use this form. See SECURITY.md.
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: In one or two sentences, with the doc or page that says so.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens instead
      description: Include exact error text. Do not paste real people's data or any secret.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest path from a fresh start.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Service (backend, intelligence-service, frontend, infra) and page or endpoint.
