spring:
  application:
    name: routine-machine
  datasource:
    url: ${ROUTINE_MACHINE_DB_URL:jdbc:postgresql://localhost:5432/routine_machine}
    username: ${ROUTINE_MACHINE_DB_USER:routine_machine}
    password: ${ROUTINE_MACHINE_DB_PASSWORD:routine_machine}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  # No default: a missing secret should fail the app at startup, not run with a guessable
  # one. See docs/backend.md's decisions log.
  jwt-secret: ${AUTH_JWT_SECRET}

# The account that inherits the data created before accounts existed (OwnerClaimService). Unset:
# nothing is claimed. Never put a real address in this file; set OWNER_EMAIL in the environment.
owner:
  email: ${OWNER_EMAIL:}
