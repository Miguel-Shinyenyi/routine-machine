# Prometheus (docs/observability.md). Static targets: three fixed services, so no service discovery.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The backend's management port: never the API port, never published to the host.
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]

  - job_name: intelligence-service
    metrics_path: /metrics
    static_configs:
      - targets: ["intelligence-service:9000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
