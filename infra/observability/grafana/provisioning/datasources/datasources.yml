apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # An exemplar is a trace id attached to one latency observation (docs/observability.md). On a chart it is a
      # dot; this makes it a link that opens that trace in the Jaeger UI (a plain link, see the Loki note below).
      exemplarTraceIdDestinations:
        - name: trace_id
          url: 'http://localhost:16686/trace/$${__value.raw}'
          urlDisplayLabel: Open trace in Jaeger

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # A log line that carries a trace id (traceId from the intelligence service, trace_id from the backend)
      # gets a link that opens that trace in the Jaeger UI. A plain link, not a Jaeger datasource: Jaeger 2.22
      # serves only the /api/v3 query API and Grafana's Jaeger datasource calls the removed v1 one (/api/services).
      derivedFields:
        - name: trace
          matcherType: regex
          matcherRegex: '"(?:traceId|trace_id)":\s*"([0-9a-f]{32})"'
          url: 'http://localhost:16686/trace/$${__value.raw}'
          urlDisplayLabel: Open trace in Jaeger
