services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: routine_machine
      POSTGRES_USER: routine_machine
      POSTGRES_PASSWORD: routine_machine
    ports:
      - "5432:5432"
    volumes:
      - routine_machine_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    environment:
      ROUTINE_MACHINE_DB_URL: jdbc:postgresql://postgres:5432/routine_machine
      ROUTINE_MACHINE_DB_USER: routine_machine
      ROUTINE_MACHINE_DB_PASSWORD: routine_machine
      UMWAYI_JOURNAL_KEY_B64: ${UMWAYI_JOURNAL_KEY_B64}
      WAKATIME_API_KEY: ${WAKATIME_API_KEY}
      # host.docker.internal, not localhost: the backend runs in its own container, aw-server
      # runs on the host. See docs/backend.md's decisions log.
      ACTIVITYWATCH_BASE_URL: ${ACTIVITYWATCH_BASE_URL:-http://host.docker.internal:5600}
      RESCUETIME_API_KEY: ${RESCUETIME_API_KEY}
      RESCUETIME_SYNC_ENABLED: ${RESCUETIME_SYNC_ENABLED:-false}
      HEALTH_INGEST_TOKEN: ${HEALTH_INGEST_TOKEN}
      # Phase 8 groundwork only, nothing in the app requires login yet. A default here (not
      # in application.yml itself) keeps `docker compose up` working out of the box; this
      # placeholder is not safe for any real deployment with real accounts. See docs/backend.md.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in infra/.env (see .env.example)}
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      # Tracing (docs/observability.md): off unless TRACING_ENABLED=true. Traces only; metrics and logs have
      # their own pipelines, so those exporters are off.
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: routine-machine-backend
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  intelligence-service:
    build:
      context: ../intelligence-service
    environment:
      BACKEND_BASE_URL: http://backend:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Optional prices (USD per million tokens) for the assessment cost metric; empty means 0.
      ANTHROPIC_INPUT_USD_PER_MTOK: ${ANTHROPIC_INPUT_USD_PER_MTOK:-}
      ANTHROPIC_OUTPUT_USD_PER_MTOK: ${ANTHROPIC_OUTPUT_USD_PER_MTOK:-}
      # Tracing (docs/observability.md): off unless TRACING_ENABLED=true. Traces only; metrics and logs have
      # their own pipelines, so those exporters are off.
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: routine-machine-intelligence
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8000:8000"
    depends_on:
      - backend

  frontend:
    build:
      context: ../frontend
    environment:
      BACKEND_URL: http://backend:8080
      INTELLIGENCE_SERVICE_URL: http://intelligence-service:8000
      # Same shared secret the backend verifies its bearer tokens against (see lib/auth/session.ts)
      # — must stay identical to the backend service's own AUTH_JWT_SECRET, so both read the one
      # value from infra/.env.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in infra/.env (see .env.example)}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - intelligence-service

  # --- Observability (docs/observability.md). Not started by a plain `docker compose up`; start with
  # `docker compose --profile observability up -d`. Both UIs are bound to this machine only (127.0.0.1).
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - observability_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 512m
    depends_on:
      - alertmanager

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.33.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - observability_alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    mem_limit: 128m

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - observability_loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 512m

  # Read-only view of Docker for the log shipper: containers and networks only, no writes. The raw
  # /var/run/docker.sock is mounted here and nowhere else.
  socket-proxy:
    profiles: ["observability"]
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.21.0
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - observability_alloy_data:/var/lib/alloy/data
    mem_limit: 256m
    depends_on:
      - loki
      - socket-proxy

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"
    mem_limit: 512m

volumes:
  routine_machine_postgres_data:
  observability_prometheus_data:
  observability_alertmanager_data:
  observability_loki_data:
  observability_alloy_data:
